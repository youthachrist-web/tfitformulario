<section class="form-section" id="sec-1">

<div class="section-head">

<div class="section-num">
02
</div>

<div class="section-title">
Logística, Frete & Operação
</div>

</div>

<div class="card-box">

<div class="field-group">

<!-- 01 -->
<div class="grid2">

<div class="field">

<label>
CEP de origem
</label>

<input
type="text"
name="originZip"
placeholder="00000-000"
/>

</div>

<div class="field">

<label>
Endereço operacional
</label>

<input
type="text"
name="operationAddress"
placeholder="Rua, cidade, estado"
/>

</div>

</div>

<!-- 02 -->
<div class="grid2">

<div class="field">

<label>
Transportadora principal
</label>

<input
type="text"
name="mainCarrier"
placeholder="Ex: DHL, Correios, Jadlog"
/>

</div>

<div class="field">

<label>
Transportadora secundária
</label>

<input
type="text"
name="secondaryCarrier"
placeholder="Opcional"
/>

</div>

</div>

<!-- 03 -->
<div class="grid2">

<div class="field">

<label>
Prazo médio de entrega
</label>

<input
type="text"
name="deliveryAverage"
placeholder="Ex: 3 a 7 dias"
/>

</div>

<div class="field">

<label>
Prazo máximo de entrega
</label>

<input
type="text"
name="deliveryMax"
placeholder="Ex: até 12 dias"
/>

</div>

</div>

<!-- 04 -->
<div class="grid2">

<div class="field">

<label>
Tempo de separação
</label>

<input
type="text"
name="handlingTime"
placeholder="Ex: 24h"
/>

</div>

<div class="field">

<label>
Tempo de postagem
</label>

<input
type="text"
name="shippingTime"
placeholder="Ex: mesmo dia"
/>

</div>

</div>

<!-- 05 -->
<div class="grid2">

<div class="field">

<label>
Quantidade de armazéns
</label>

<input
type="text"
name="warehouseCount"
placeholder="Ex: 2"
/>

</div>

<div class="field">

<label>
Localização dos armazéns
</label>

<input
type="text"
name="warehouseLocations"
placeholder="Ex: SP, RJ, Lisboa"
/>

</div>

</div>

<!-- 06 -->
<div class="grid2">

<div class="field">

<label>
Capacidade média de estoque
</label>

<input
type="text"
name="stockCapacity"
placeholder="Ex: 10.000 peças"
/>

</div>

<div class="field">

<label>
Sistema de estoque utilizado
</label>

<input
type="text"
name="inventorySystem"
placeholder="Ex: Tiny ERP"
/>

</div>

</div>

<!-- 07 -->
<div class="grid2">

<div class="field">

<label>
Frete grátis acima de
</label>

<input
type="text"
name="freeShipping"
placeholder="Ex: R$299"
/>

</div>

<div class="field">

<label>
Custo médio do frete
</label>

<input
type="text"
name="shippingAverageCost"
placeholder="Ex: R$28"
/>

</div>

</div>

<!-- 08 -->
<div class="grid2">

<div class="field">

<label>
Regiões atendidas
</label>

<input
type="text"
name="regionsServed"
placeholder="Brasil, Europa, EUA..."
/>

</div>

<div class="field">

<label>
Envios internacionais
</label>

<select name="internationalShipping">

<option value="">
Selecionar
</option>

<option>
Sim
</option>

<option>
Não
</option>

</select>

</div>

</div>

<!-- 09 -->
<div class="grid2">

<div class="field">

<label>
Taxa média de devolução
</label>

<input
type="text"
name="returnRate"
placeholder="Ex: 2%"
/>

</div>

<div class="field">

<label>
Prazo de troca/devolução
</label>

<input
type="text"
name="exchangePolicy"
placeholder="Ex: 7 dias"
/>

</div>

</div>

<!-- 10 -->
<div class="grid2">

<div class="field">

<label>
Possui rastreamento?
</label>

<select name="trackingSystem">

<option value="">
Selecionar
</option>

<option>
Sim
</option>

<option>
Não
</option>

</select>

</div>

<div class="field">

<label>
Integração logística atual
</label>

<input
type="text"
name="logisticsIntegration"
placeholder="Ex: Shopify, Bling"
/>

</div>

</div>

<!-- 11 -->
<div class="grid2">

<div class="field">

<label>
Maior problema operacional
</label>

<textarea
name="biggestLogisticsProblem"
placeholder="Explique os gargalos logísticos..."
></textarea>

</div>

<div class="field">

<label>
Meta ideal de entrega
</label>

<textarea
name="deliveryGoal"
placeholder="Ex: entregar em até 48h"
></textarea>

</div>

</div>

<!-- 12 -->
<div class="field">

<label>
Estratégia logística desejada
</label>

<div class="check-grid">

<label class="check-item">
<input type="checkbox" name="logisticsStrategy" value="Entrega Expressa">
<span class="mark"></span>
Entrega Expressa
</label>

<label class="check-item">
<input type="checkbox" name="logisticsStrategy" value="Same Day">
<span class="mark"></span>
Same Day
</label>

<label class="check-item">
<input type="checkbox" name="logisticsStrategy" value="Pickup Store">
<span class="mark"></span>
Pickup Store
</label>

<label class="check-item">
<input type="checkbox" name="logisticsStrategy" value="Dropshipping">
<span class="mark"></span>
Dropshipping
</label>

<label class="check-item">
<input type="checkbox" name="logisticsStrategy" value="Cross Docking">
<span class="mark"></span>
Cross Docking
</label>

<label class="check-item">
<input type="checkbox" name="logisticsStrategy" value="Fullfilment">
<span class="mark"></span>
Fullfilment
</label>

</div>

</div>

</div>

</div>

</section>

<style>

/* =========================================================
RESET
========================================================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

:root{

--bg:#070707;
--bg2:#101010;
--bg3:#171717;

--gold:#c9a84c;
--gold2:#e4c26d;

--text:#f5f5f5;
--muted:#999;
--line:#232323;

--radius:14px;

--shadow:
0 20px 60px rgba(0,0,0,.45);

}

html{
scroll-behavior:smooth;
}

body{

background:
radial-gradient(
circle at top right,
rgba(201,168,76,.08),
transparent 35%
),
#070707;

font-family:'Inter',sans-serif;

color:var(--text);

min-height:100vh;

overflow-x:hidden;

}

/* NOISE */

body::after{

content:'';

position:fixed;

inset:0;

background-image:
url('https://grainy-gradients.vercel.app/noise.svg');

opacity:.025;

pointer-events:none;

z-index:99999;

}

/* =========================================================
SCROLLBAR
========================================================= */

::-webkit-scrollbar{
width:6px;
}

::-webkit-scrollbar-thumb{
background:#2a2a2a;
border-radius:999px;
}

::-webkit-scrollbar-thumb:hover{
background:var(--gold);
}

/* =========================================================
LOADER
========================================================= */

#loader{

position:fixed;

inset:0;

background:#070707;

display:flex;

align-items:center;

justify-content:center;

z-index:999999;

transition:.6s;

}

.loader-logo{

font-family:'Playfair Display',serif;

font-size:42px;

letter-spacing:8px;

color:var(--gold);

animation:pulse 2s infinite;

}

@keyframes pulse{

0%{
opacity:.4;
transform:scale(.97);
}

50%{
opacity:1;
transform:scale(1);
}

100%{
opacity:.4;
transform:scale(.97);
}

}

/* =========================================================
NAVBAR
========================================================= */

#nav{

position:fixed;

top:0;
left:0;
right:0;

height:72px;

backdrop-filter:blur(24px);

background:rgba(7,7,7,.78);

border-bottom:1px solid rgba(255,255,255,.04);

z-index:1000;

}

#nav-inner{

max-width:1180px;

height:100%;

margin:auto;

padding:0 24px;

display:flex;

align-items:center;

justify-content:space-between;

gap:20px;

}

#logo{

font-family:'Playfair Display',serif;

font-size:20px;

letter-spacing:5px;

color:var(--gold);

font-weight:800;

}

#nav-pills{

display:flex;

gap:6px;

overflow:auto;

scrollbar-width:none;

}

#nav-pills::-webkit-scrollbar{
display:none;
}

.pill{

border:none;

background:transparent;

color:var(--muted);

padding:7px 14px;

border-radius:999px;

font-size:12px;

cursor

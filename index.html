<style>

/* =========================================================
RESET
========================================================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

:root{

--bg:#070707;
--bg2:#101010;
--bg3:#171717;

--gold:#c9a84c;
--gold2:#e4c26d;

--text:#f5f5f5;
--muted:#999;
--line:#232323;

--radius:14px;

--shadow:
0 20px 60px rgba(0,0,0,.45);

}

html{
scroll-behavior:smooth;
}

body{

background:
radial-gradient(
circle at top right,
rgba(201,168,76,.08),
transparent 35%
),
#070707;

font-family:'Inter',sans-serif;

color:var(--text);

min-height:100vh;

overflow-x:hidden;

}

/* NOISE */

body::after{

content:'';

position:fixed;

inset:0;

background-image:
url('https://grainy-gradients.vercel.app/noise.svg');

opacity:.025;

pointer-events:none;

z-index:99999;

}

/* =========================================================
SCROLLBAR
========================================================= */

::-webkit-scrollbar{
width:6px;
}

::-webkit-scrollbar-thumb{
background:#2a2a2a;
border-radius:999px;
}

::-webkit-scrollbar-thumb:hover{
background:var(--gold);
}

/* =========================================================
LOADER
========================================================= */

#loader{

position:fixed;

inset:0;

background:#070707;

display:flex;

align-items:center;

justify-content:center;

z-index:999999;

transition:.6s;

}

.loader-logo{

font-family:'Playfair Display',serif;

font-size:42px;

letter-spacing:8px;

color:var(--gold);

animation:pulse 2s infinite;

}

@keyframes pulse{

0%{
opacity:.4;
transform:scale(.97);
}

50%{
opacity:1;
transform:scale(1);
}

100%{
opacity:.4;
transform:scale(.97);
}

}

/* =========================================================
NAVBAR
========================================================= */

#nav{

position:fixed;

top:0;
left:0;
right:0;

height:72px;

backdrop-filter:blur(24px);

background:rgba(7,7,7,.78);

border-bottom:1px solid rgba(255,255,255,.04);

z-index:1000;

}

#nav-inner{

max-width:1180px;

height:100%;

margin:auto;

padding:0 24px;

display:flex;

align-items:center;

justify-content:space-between;

gap:20px;

}

#logo{

font-family:'Playfair Display',serif;

font-size:20px;

letter-spacing:5px;

color:var(--gold);

font-weight:800;

}

#nav-pills{

display:flex;

gap:6px;

overflow:auto;

scrollbar-width:none;

}

#nav-pills::-webkit-scrollbar{
display:none;
}

.pill{

border:none;

background:transparent;

color:var(--muted);

padding:7px 14px;

border-radius:999px;

font-size:12px;

cursor:pointer;

white-space:nowrap;

transition:.25s;

}

.pill:hover{

background:rgba(255,255,255,.05);

color:var(--text);

}

.pill.active{

background:var(--gold);

color:#111;

font-weight:700;

}

#progress-bar{

position:absolute;

left:0;
bottom:0;

width:100%;
height:2px;

background:#151515;

}

#progress-fill{

height:100%;

width:0%;

background:var(--gold);

transition:.35s;

}

/* =========================================================
MAIN
========================================================= */

main{

max-width:960px;

margin:auto;

padding:
120px 22px
120px;

}

/* =========================================================
HERO
========================================================= */

.hero{

position:relative;

margin-bottom:70px;

}

.hero::before{

content:'';

position:absolute;

width:420px;
height:420px;

background:
rgba(201,168,76,.06);

filter:blur(120px);

top:-120px;
right:-80px;

z-index:-1;

}

.hero h1{

font-family:'Playfair Display',serif;

font-size:clamp(40px,6vw,76px);

line-height:1.05;

margin-bottom:20px;

}

.hero h1 em{

color:var(--gold);

font-style:italic;

}

.hero p{

max-width:650px;

font-size:17px;

line-height:1.8;

color:var(--muted);

}

/* =========================================================
SECTIONS
========================================================= */

.form-section{

margin-bottom:70px;

scroll-margin-top:100px;

}

.section-head{

margin-bottom:35px;

padding-bottom:18px;

border-bottom:1px solid var(--line);

}

.section-num{

font-size:11px;

letter-spacing:3px;

text-transform:uppercase;

font-weight:700;

color:var(--gold);

margin-bottom:6px;

}

.section-title{

font-size:30px;

font-family:'Playfair Display',serif;

}

/* =========================================================
CARDS
========================================================= */

.card-box{

background:
rgba(255,255,255,.02);

backdrop-filter:blur(20px);

border:
1px solid rgba(255,255,255,.05);

border-radius:18px;

padding:32px;

box-shadow:var(--shadow);

margin-top:24px;

}

/* =========================================================
FIELDS
========================================================= */

.field-group{

display:flex;

flex-direction:column;

gap:24px;

}

.grid2{

display:grid;

grid-template-columns:1fr 1fr;

gap:24px;

}

@media(max-width:768px){

.grid2{
grid-template-columns:1fr;
}

}

.field{

display:flex;

flex-direction:column;

gap:10px;

}

label{

font-size:12px;

font-weight:700;

text-transform:uppercase;

letter-spacing:.6px;

color:var(--muted);

}

input[type=text],
input[type=email],
input[type=password],
input[type=url],
textarea,
select{

width:100%;

background:rgba(255,255,255,.03);

border:1px solid rgba(255,255,255,.06);

color:var(--text);

padding:15px 16px;

border-radius:12px;

font-size:14px;

outline:none;

transition:.25s;

font-family:'Inter',sans-serif;

}

textarea{

resize:vertical;

min-height:120px;

}

input:hover,
textarea:hover,
select:hover{

border-color:#3b3b3b;

}

input:focus,
textarea:focus,
select:focus{

border-color:var(--gold);

box-shadow:
0 0 0 4px rgba(201,168,76,.08);

}

input::placeholder,
textarea::placeholder{

color:#555;

}

/* =========================================================
CHECKS & RADIOS
========================================================= */

.check-grid,
.radio-grid{

display:grid;

grid-template-columns:
repeat(auto-fill,minmax(170px,1fr));

gap:12px;

}

.check-item,
.radio-item{

display:flex;

align-items:center;

gap:10px;

padding:13px 16px;

border-radius:14px;

background:rgba(255,255,255,.02);

border:1px solid rgba(255,255,255,.05);

cursor:pointer;

transition:.25s;

user-select:none;

}

.check-item:hover,
.radio-item:hover{

border-color:
rgba(201,168,76,.35);

transform:translateY(-1px);

}

.check-item input,
.radio-item input{

display:none;

}

.mark{

width:18px;
height:18px;

border-radius:50%;

border:2px solid #555;

display:flex;

align-items:center;

justify-content:center;

flex-shrink:0;

transition:.25s;

}

.check-item input:checked ~ .mark,
.radio-item input:checked ~ .mark{

background:var(--gold);

border-color:var(--gold);

}

.check-item.selected,
.radio-item.selected{

border-color:var(--gold);

background:
rgba(201,168,76,.08);

}

/* =========================================================
UPLOAD
========================================================= */

#drop-zone{

border:2px dashed rgba(255,255,255,.08);

border-radius:20px;

padding:50px 24px;

text-align:center;

cursor:pointer;

transition:.25s;

background:
rgba(255,255,255,.01);

}

#drop-zone:hover,
#drop-zone.drag-over{

border-color:var(--gold);

background:
rgba(201,168,76,.03);

}

#drop-zone p{

margin-top:14px;

font-size:15px;

color:var(--muted);

}

#drop-zone small{

color:#555;

}

#file-list{

display:grid;

grid-template-columns:1fr 1fr;

gap:12px;

margin-top:20px;

}

@media(max-width:650px){

#file-list{
grid-template-columns:1fr;
}

}

.file-item{

display:flex;

align-items:center;

justify-content:space-between;

gap:12px;

padding:14px;

border-radius:14px;

background:
rgba(255,255,255,.03);

border:1px solid rgba(255,255,255,.05);

}

.file-meta{

overflow:hidden;

}

.file-name{

font-size:13px;

font-weight:600;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

}

.file-size{

font-size:12px;

color:var(--muted);

}

/* =========================================================
BUTTON
========================================================= */

#submit-btn{

width:100%;

padding:18px;

margin-top:20px;

border:none;

border-radius:16px;

background:var(--gold);

color:#111;

font-size:15px;

font-weight:800;

letter-spacing:.5px;

cursor:pointer;

transition:.25s;

position:sticky;

bottom:20px;

z-index:20;

}

#submit-btn:hover{

transform:translateY(-2px);

background:var(--gold2);

box-shadow:
0 14px 40px rgba(201,168,76,.25);

}

#submit-btn:disabled{

opacity:.5;

cursor:not-allowed;

}

/* =========================================================
ERROR
========================================================= */

#error-msg{

display:none;

padding:14px 16px;

border-radius:12px;

background:
rgba(220,50,50,.08);

border:
1px solid rgba(220,50,50,.3);

color:#ff8b8b;

margin-bottom:18px;

}

/* =========================================================
SUCCESS
========================================================= */

#success-screen{

display:none;

position:fixed;

inset:0;

z-index:5000;

background:
radial-gradient(
circle,
rgba(201,168,76,.08),
transparent 50%
),
#070707;

align-items:center;

justify-content:center;

padding:30px;

text-align:center;

}

#success-screen.show{
display:flex;
}

.success-box{

max-width:500px;

}

.success-box h2{

font-family:'Playfair Display',serif;

font-size:42px;

margin-bottom:16px;

color:var(--gold);

}

.success-box p{

font-size:17px;

line-height:1.8;

color:var(--muted);

}

/* =========================================================
REVEAL
========================================================= */

.reveal{

opacity:0;

transform:translateY(40px);

transition:
1s cubic-bezier(.2,.8,.2,1);

}

.reveal.show{

opacity:1;

transform:none;

}

/* =========================================================
SPINNER
========================================================= */

.spinner{

display:inline-block;

width:18px;
height:18px;

border:2px solid rgba(17,17,17,.3);

border-top-color:#111;

border-radius:50%;

animation:spin .7s linear infinite;

vertical-align:middle;

margin-right:10px;

}

@keyframes spin{

to{
transform:rotate(360deg);
}

}

.hidden{
display:none!important;
}

</style>

</head>

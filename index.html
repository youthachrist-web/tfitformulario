<!DOCTYPE html>  
<html lang="pt-BR">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>THYMOS — Sistema Estratégico Premium</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">

<style>
/* =========================================================
RESET
========================================================= */
*{
margin:0;
padding:0;
box-sizing:border-box;
}

:root{
--bg:#070707;
--bg2:#101010;
--bg3:#171717;
--gold:#c9a84c;
--gold2:#e4c26d;
--text:#f5f5f5;
--muted:#999;
--line:#232323;
--radius:14px;
--shadow:0 20px 60px rgba(0,0,0,.45);
}

html{
scroll-behavior:smooth;
}

body{
background: radial-gradient(circle at top right, rgba(201,168,76,.08), transparent 35%), #070707;
font-family:'Inter',sans-serif;
color:var(--text);
min-height:100vh;
overflow-x:hidden;
}

body::after{
content:'';
position:fixed;
inset:0;
background-image: url('https://grainy-gradients.vercel.app/noise.svg');
opacity:.025;
pointer-events:none;
z-index:99999;
}

/* =========================================================
SCROLLBAR
========================================================= */
::-webkit-scrollbar{
width:6px;
}
::-webkit-scrollbar-thumb{
background:#2a2a2a;
border-radius:999px;
}
::-webkit-scrollbar-thumb:hover{
background:var(--gold);
}

/* =========================================================
LOADER (CORRIGIDO PARA DESAPARECER INSTANTANEAMENTE)
========================================================= */
#loader{
position:fixed;
inset:0;
background:#070707;
display:flex;
align-items:center;
justify-content:center;
z-index:999999;
transition: opacity 0.2s ease-out;
}

.loader-logo{
font-family:'Playfair Display',serif;
font-size:42px;
letter-spacing:8px;
color:var(--gold);
animation:pulse 1.5s infinite;
}

@keyframes pulse{
0%{ opacity:.4; transform:scale(.97); }
50%{ opacity:1; transform:scale(1); }
100%{ opacity:.4; transform:scale(.97); }
}

/* =========================================================
NAVBAR
========================================================= */
#nav{
position:fixed;
top:0; left:0; right:0;
height:72px;
backdrop-filter:blur(24px);
background:rgba(7,7,7,.78);
border-bottom:1px solid rgba(255,255,255,.04);
z-index:1000;
}

#nav-inner{
max-width:1180px;
height:100%;
margin:auto;
padding:0 24px;
display:flex;
align-items:center;
justify-content:space-between;
gap:20px;
}

#logo{
font-family:'Playfair Display',serif;
font-size:20px;
letter-spacing:5px;
color:var(--gold);
font-weight:800;
}

#nav-pills{
display:flex;
gap:6px;
overflow:auto;
scrollbar-width:none;
}

#nav-pills::-webkit-scrollbar{
display:none;
}

.pill{
border:none;
background:transparent;
color:var(--muted);
padding:7px 14px;
border-radius:999px;
font-size:12px;
cursor:pointer;
white-space:nowrap;
transition:.25s;
}

.pill:hover{
background:rgba(255,255,255,.05);
color:var(--text);
}

.pill.active{
background:var(--gold);
color:#111;
font-weight:700;
}

#progress-bar{
position:absolute;
left:0; bottom:0;
width:100%; height:2px;
background:#151515;
}

#progress-fill{
height:100%;
width:0%;
background:var(--gold);
transition:.35s;
}

/* =========================================================
MAIN & SECTIONS
========================================================= */
main{
max-width:960px;
margin:auto;
padding: 120px 22px 120px;
}

.hero{
position:relative;
margin-bottom:70px;
}

.hero::before{
content:'';
position:absolute;
width:420px; height:420px;
background: rgba(201,168,76,.06);
filter:blur(120px);
top:-120px; right:-80px;
z-index:-1;
}

.hero h1{
font-family:'Playfair Display',serif;
font-size:clamp(40px,6vw,76px);
line-height:1.05;
margin-bottom:20px;
}

.hero h1 em{
color:var(--gold);
font-style:italic;
}

.hero p{
max-width:650px;
font-size:17px;
line-height:1.8;
color:var(--muted);
}

.form-section{
margin-bottom:70px;
scroll-margin-top:100px;
}

.section-head{
margin-bottom:35px;
padding-bottom:18px;
border-bottom:1px solid var(--line);
}

.section-num{
font-size:11px;
letter-spacing:3px;
text-transform:uppercase;
font-weight:700;
color:var(--gold);
margin-bottom:6px;
}

.section-title{
font-size:30px;
font-family:'Playfair Display',serif;
}

.card-box{
background: rgba(255,255,255,.02);
backdrop-filter:blur(20px);
border: 1px solid rgba(255,255,255,.05);
border-radius:18px;
padding:32px;
box-shadow:var(--shadow);
margin-top:24px;
}

/* =========================================================
FIELDS
========================================================= */
.field-group{
display:flex;
flex-direction:column;
gap:24px;
}

.grid2{
display:grid;
grid-template-columns:1fr 1fr;
gap:24px;
}

@media(max-width:768px){
.grid2{ grid-template-columns:1fr; }
}

.field{
display:flex;
flex-direction:column;
gap:10px;
}

label{
font-size:12px;
font-weight:700;
text-transform:uppercase;
letter-spacing:.6px;
color:var(--muted);
}

input[type=text],
input[type=email],
input[type=password],
input[type=url],
textarea,
select{
width:100%;
background:rgba(255,255,255,.03);
border:1px solid rgba(255,255,255,.06);
color:var(--text);
padding:15px 16px;
border-radius:12px;
font-size:14px;
outline:none;
transition:.25s;
font-family:'Inter',sans-serif;
}

textarea{
resize:vertical;
min-height:120px;
}

input:hover, textarea:hover, select:hover{
border-color:#3b3b3b;
}

input:focus, textarea:focus, select:focus{
border-color

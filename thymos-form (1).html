<!-- AUTO SAVE -->
<script>
const allFields = document.querySelectorAll('input, textarea, select');

allFields.forEach(field => {

  field.addEventListener('input', () => {

    if(field.type === 'checkbox' || field.type === 'radio'){

      localStorage.setItem(
        field.name + field.value,
        field.checked
      );

    } else {

      localStorage.setItem(field.name, field.value);

    }

  });

  if(field.type === 'checkbox' || field.type === 'radio'){

    const checked =
      localStorage.getItem(field.name + field.value);

    if(checked === 'true'){
      field.checked = true;
      field.closest('.check-item, .radio-item')
      ?.classList.add('selected');
    }

  } else {

    const saved = localStorage.getItem(field.name);

    if(saved){
      field.value = saved;
    }

  }

});
</script>

<!-- REAL PROGRESS -->
<script>
function updateRealProgress(){

  const fields =
  document.querySelectorAll(
    'input, textarea, select'
  );

  let filled = 0;

  fields.forEach(f => {

    if(
      f.type === 'checkbox' ||
      f.type === 'radio'
    ){

      if(f.checked) filled++;

    } else {

      if(f.value.trim() !== ''){
        filled++;
      }

    }

  });

  const progress =
  (filled / fields.length) * 100;

  document.getElementById(
    'progress-fill'
  ).style.width = progress + '%';

}

document.querySelectorAll(
  'input, textarea, select'
).forEach(el => {

  el.addEventListener(
    'input',
    updateRealProgress
  );

  el.addEventListener(
    'change',
    updateRealProgress
  );

});

updateRealProgress();
</script>

<!-- FILE LIMIT -->
<script>
function addFiles(files){

  const file = files[0];

  if(!file) return;

  if(file.size > 10 * 1024 * 1024){

    alert('Máximo permitido: 10MB');

    return;

  }

  uploadedFiles = [file];

  renderFiles();

}
</script>

<!-- SCROLL REVEAL -->
<script>
const reveals =
document.querySelectorAll('.form-section');

const observer =
new IntersectionObserver(entries=>{

  entries.forEach(entry=>{

    if(entry.isIntersecting){

      entry.target.classList.add('show');

    }

  });

},{
  threshold:0.15
});

reveals.forEach(r=>{

  r.classList.add('reveal');

  observer.observe(r);

});
</script>

<script>

});
</script>

<!-- CLEAR FORM AFTER SUCCESS -->
<script>
function clearLocalStorageForm(){

  document.querySelectorAll(
    'input, textarea, select'
  ).forEach(field=>{

    if(field.name){

      localStorage.removeItem(field.name);
      localStorage.removeItem(
        field.name + field.value
      );

    }

  });

}
</script>

<!-- SUBMIT PREMIUM -->
<script>
const form =
document.getElementById('main-form');

form.addEventListener(
'submit',
function(e){

e.preventDefault();

const brandName =
document.getElementById(
'brandName'
).value.trim();

if(!brandName){

document.getElementById(
'brandName'
).focus();

return;

}

const btn =
document.getElementById(
'submit-btn'
);

const err =
document.getElementById(
'error-msg'
);

btn.disabled = true;

btn.innerHTML =
'<span class="spinner"></span>A enviar...';

err.style.display = 'none';

const formData =
new FormData(form);

if(uploadedFiles.length > 0){

formData.append(
'attachment',
uploadedFiles[0]
);

}

fetch(
'https://api.web3forms.com/submit',
{
method:'POST',
body:formData
}
)

.then(async(response)=>{

let json =
await response.json();

if(response.status == 200){

clearLocalStorageForm();

document.getElementById(
'form-page'
).style.display='none';

document.getElementById(
'success-screen'
).classList.add('show');

window.scrollTo({
top:0,
behavior:'smooth'
});

}else{

err.textContent =
json.message ||
'Ocorreu um erro ao enviar.';

err.style.display='block';

btn.disabled=false;

btn.textContent =
'Enviar Formulário';

}

})

.catch((error)=>{

console.log(error);

err.textContent =
'Erro de rede.';

err.style.display='block';

btn.disabled=false;

btn.textContent =
'Enviar Formulário';

});

});
</script>
